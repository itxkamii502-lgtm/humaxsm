<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Owner Panel — HUMAX SMS</title>
<meta name="description" content="HUMAX SMS Gateway for OTP, virtual number management, and SMS live feeds">
<meta property="og:title" content="Owner Panel — HUMAX SMS">
<meta property="og:description" content="HUMAX SMS Gateway for OTP, virtual number management, and SMS live feeds">
<link rel="icon" type="image/png" href="/static/img/humax-sms-logo.png">
<script>
(function(){
  try {
    var s = window.__BRAND_SETTINGS__;
    if (!s) {
      var c = localStorage.getItem('app_brand_settings');
      if (c) s = JSON.parse(c);
    }
    var hg = (s && s.header_gradient && !s.header_gradient.includes('#1b4332')) ? s.header_gradient : 'linear-gradient(180deg, #ffffff 0%, #f8faf9 100%)';
    var tc = (s && s.header_text_color && s.header_text_color !== '#ffffff') ? s.header_text_color : '#1e293b';
    var fw = (s && s.header_font_weight) || '700';
    var r = document.documentElement;
    r.style.setProperty('--header-gradient', hg);
    r.style.setProperty('--header-text-color', tc);
    r.style.setProperty('--header-font-weight', fw);
    r.style.setProperty('--brand-primary', '#00a86b');
    r.style.setProperty('--brand-hover', '#059669');
    r.style.setProperty('--brand-accent', '#10b981');
    r.style.setProperty('--zy-blue-top', '#00a86b');
    r.style.setProperty('--zy-blue-bot', '#059669');
    r.style.setProperty('--zy-blue', '#00a86b');

    var st = document.createElement('style');
    st.id = 'zero-fouc-shield';
    st.textContent = ':root{--header-gradient:' + hg + ' !important;--header-text-color:' + tc + ' !important;--brand-primary:#00a86b !important;--brand-hover:#059669 !important;}' +
      '.zy-header, .adminui .zy-header, .zy-header-row, .adminui .zy-header-row, .zy-side-head, .adminui .zy-side-head, .zy-side-foot, .adminui .zy-side-foot { background: #ffffff !important; color: #1e293b !important; border-bottom: 1.5px solid #d5e4dd !important; }' +
      '.zy-head-title, .zy-role, .zy-welcome, .adminui .zy-user, .zy-user { color: #1e293b !important; }' +
      '.zy-side, .adminui .zy-side, .zy-sidenav, .adminui .zy-sidenav { background: #ffffff !important; background-color: #ffffff !important; }' +
      '.zy-main { background-color: #edf3f0 !important; }';
    (document.head || document.documentElement).appendChild(st);
  } catch(e) {}
})();
</script>
<script src="/static/js/brand-theme.js"></script>
<script src="/static/js/speed-auth-guard.js"></script>
<script src="/static/js/speed-profile-security.js"></script>
<script>
  if (window.SpeedAuth) {
    if (!window.SpeedAuth.enforce(['Owner', 'Admin'])) {
      window.__AUTH_BLOCKED__ = true;
    }
    window.SpeedAuth.initCrossTabWatcher(['Owner', 'Admin']);
  }
</script>
<link rel="stylesheet" href="/static/css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/cropper.min.css">
<link rel="stylesheet" href="/static/css/speed-panel.css">
<link rel="stylesheet" href="/static/css/speed-admin-skin.css">
<link rel="stylesheet" href="/static/css/apx-telecom.css">
</head>
<body class="light alphaui rmsui adminui">

<aside class="zy-side" id="sidebar">
  <div class="zy-side-head">
    <button class="zy-side-close" onclick="zyCloseSidebar()" aria-label="Close" type="button"><i class="fas fa-times"></i></button>
    <div class="zy-avatar-lg" style="background-color: #ffffff;"><img src="/static/img/humax-sms-logo.png" alt="HUMAX SMS" class="zy-ava-dp-img" style="width:100%;height:100%;object-fit:cover;border-radius:50%;display:block;background-color:#ffffff;"></div>
    <div class="zy-welcome">Welcome <span id="mgr-username-side">Kamran_Bhatti</span></div>
    <div class="zy-role" id="brand-role">Owner Panel</div>
    <div class="zy-clock" id="zy-clock">&mdash;</div>
  </div>
  <nav class="zy-sidenav" id="zy-sidenav"></nav>
  <div class="zy-side-foot"></div>
</aside>
<div class="zy-side-backdrop" id="zy-side-backdrop" onclick="zyCloseSidebar()"></div>

<div class="zy-main" id="main-wrapper">
  <header class="zy-header">
    <div class="zy-header-row">
      <div class="zy-head-left">
        <button class="zy-side-toggle" onclick="zyToggleSidebar()" title="Toggle Sidebar" aria-label="Toggle Sidebar"><i class="fas fa-bars"></i></button>
        <div class="zy-head-title" id="zy-logo"><span class="zy-panel-badge"><img class="zy-badge-logo" src="/static/img/humax-sms-logo.png" alt="HUMAX SMS" onerror="this.style.display='none';"> <span class="zy-badge-name">HUMAX SMS</span></span></div>
      </div>
      <div class="zy-head-right">
        <button class="zy-bell-btn" onclick="loadPage('announcements')" title="Notifications" aria-label="Notifications">
          <i class="fas fa-bell"></i>
          <span class="zy-bell-badge" style="display:none;">0</span>
        </button>
        <div class="zy-user" onclick="zyToggleUser(event)" title="Profile & Account" role="button" tabindex="0" aria-haspopup="true">
          <span id="mgr-username" style="display:none;">Kamran_Bhatti</span>
          <span class="zy-ava" title="Profile"><img src="/static/img/humax-sms-logo.png" alt="HUMAX SMS" class="zy-ava-dp-img" style="width:100%;height:100%;object-fit:cover;border-radius:50%;display:block;"></span>
        </div>
        <div class="zy-user-menu" id="zy-user-menu" role="menu">
          <a onclick="loadPage('my-profile')" role="menuitem"><i class="far fa-user"></i> <span>My Profile</span></a>
          <a onclick="loadPage('my-payouts')" role="menuitem"><i class="fas fa-wallet"></i> <span>My Payout</span></a>
          <a onclick="loadPage('api-tokens')" role="menuitem"><i class="fas fa-key"></i> <span>REST API</span></a>
          <a onclick="loadPage('audit-logs')" role="menuitem"><i class="far fa-file-lines"></i> <span>Audit Log</span></a>
          <div class="zy-um-divider"></div>
          <a class="zy-um-logout" onclick="doLogout()" role="menuitem"><i class="fas fa-arrow-right-from-bracket"></i> <span>Logout</span></a>
        </div>
      </div>
    </div>
    <div class="zy-mega" id="zy-mega"></div>
  </header>

  <div class="zy-body">
    <div class="zy-crumb">
      <div class="zy-crumb-left"><a onclick="loadPage('dashboard')">Home</a><span class="zy-sep">&raquo;</span><span id="breadcrumb">Dashboard</span></div>
      <div class="zy-crumb-clock"><i class="far fa-clock"></i> <span id="zy-utc-time">—</span> UTC</div>
    </div>
    <main class="page-content" id="page-content"></main>
  </div>
</div>

<span id="live-stat" style="display:none"></span>
<div class="toast-container" id="toast-container"></div>
<div class="modal-overlay" id="modal-overlay" onclick="closeModal()">
  <div class="modal" id="modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <h3 id="modal-title">Modal</h3>
      <button onclick="closeModal()"><i class="fas fa-times"></i></button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<script src="/static/js/cropper.min.js"></script>
<script src="/static/js/app.js"></script>
<script src="/static/js/new_features.js"></script>
<script src="/static/js/speed-kit.js"></script>
<script src="/static/js/speed-admin.js"></script>
<script src="/static/js/speed-loginpanel.js"></script>
<script src="/static/js/speed-url.js"></script>
<script src="/static/js/speed-flash.js"></script>
<script src="/static/js/apx-grid.js"></script>
</body>
</html>
