<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HUMAX SMS | Login</title>
<link rel="icon" type="image/png" href="/static/img/humax-sms-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script>
(function(){
  try {
    var s = window.__BRAND_SETTINGS__;
    if (!s) {
      var c = localStorage.getItem('app_brand_settings');
      if (c) s = JSON.parse(c);
    }
    if (s && s.site_name) {
      document.title = s.site_name + ' | Login';
    }
    var hg = (s && s.header_gradient && !s.header_gradient.includes('#1b4332')) ? s.header_gradient : 'linear-gradient(180deg, #ffffff 0%, #f8faf9 100%)';
    var r = document.documentElement;
    r.style.setProperty('--header-gradient', hg);
    r.style.setProperty('--brand-primary', '#00a86b');
    r.style.setProperty('--brand-hover', '#059669');
  } catch(e) {}
})();
</script>
<script src="/static/js/brand-theme.js"></script>
<script src="/static/js/speed-auth-guard.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background-color: #edf3f0;
  background-image: radial-gradient(circle at 50% 15%, #f4f8f6 0%, #e5ede8 100%);
  color: #1e293b;
  padding: 20px 14px;
  position: relative;
  overflow-x: hidden;
}

/* ── Centered Card Matching Screenshot ── */
.login-card {
  width: 100%;
  max-width: 410px;
  background: #ffffff;
  border-radius: 28px;
  border: 1px solid #d5e3dc;
  box-shadow: 0 20px 45px -8px rgba(0, 168, 107, 0.12), 0 8px 24px -4px rgba(15, 23, 42, 0.06), inset 0 1px 0 rgba(255, 255, 255, 0.9);
  padding: 36px 32px 34px;
  animation: cardFadeIn 0.35s ease both;
  overflow: hidden;
  position: relative;
}
@keyframes cardFadeIn {
  from { opacity: 0; transform: translateY(12px) scale(0.98); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

/* ── Logo Box (Strictly bounded responsive on PC, Tablet, Mobile) ── */
.brand-logo-wrap {
  width: 100%;
  max-width: 210px;
  height: 72px;
  max-height: 75px;
  margin: 0 auto 14px auto;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
}
.brand-logo-img {
  width: auto !important;
  height: auto !important;
  max-width: 100% !important;
  max-height: 100% !important;
  object-fit: contain !important;
  display: block !important;
  margin: 0 auto !important;
  transition: transform 0.2s ease;
}
.brand-logo-img:hover {
  transform: scale(1.02);
}

@media (max-width: 768px) {
  .login-card {
    padding: 32px 26px 30px;
  }
  .brand-logo-wrap {
    max-width: 195px;
    height: 66px;
    max-height: 68px;
    margin-bottom: 12px;
  }
}

@media (max-width: 480px) {
  .login-card {
    padding: 28px 20px 26px;
    border-radius: 22px;
  }
  .brand-logo-wrap {
    max-width: 175px;
    height: 58px;
    max-height: 60px;
    margin-bottom: 10px;
  }
}

@media (max-width: 360px) {
  .brand-logo-wrap {
    max-width: 145px;
    height: 48px;
    max-height: 50px;
    margin-bottom: 8px;
  }
}

/* ── Clean Subtitle from Screenshot ── */
.login-sub {
  font-size: 15px;
  font-weight: 700;
  color: #111827;
  text-align: center;
  margin-top: 0;
  margin-bottom: 20px;
  letter-spacing: -0.2px;
}

/* ── Error Box ── */
.login-err {
  background: #fef2f2;
  color: #b91c1c;
  border: 1px solid #fecaca;
  padding: 10px 14px;
  border-radius: 12px;
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 18px;
  text-align: center;
}

/* ── Pill Input Fields from Screenshot ── */
.pill-input-wrap {
  position: relative;
  background: #f4f8f6;
  border-radius: 9999px;
  height: 54px;
  display: flex;
  align-items: center;
  padding: 0 20px;
  margin-bottom: 16px;
  border: 1.5px solid #d5e4dd;
  box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.03);
  transition: all 0.2s ease;
}
.pill-input-wrap:focus-within {
  background: #ffffff;
  border-color: #00a86b;
  box-shadow: 0 0 0 3.5px rgba(0, 168, 107, 0.18);
}
.pill-icon {
  color: #00a86b;
  font-size: 16px;
  margin-right: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 20px;
  flex-shrink: 0;
}
.pill-input-wrap input {
  width: 100%;
  height: 100%;
  background: transparent;
  border: none;
  font-family: inherit;
  font-size: 15px;
  font-weight: 500;
  color: #1e293b;
  outline: none;
}
.pill-input-wrap input::placeholder {
  color: #8c9ba5;
  font-weight: 500;
}
.eye-toggle {
  background: transparent;
  border: none;
  color: #8c9ba5;
  font-size: 15px;
  cursor: pointer;
  padding: 6px;
  margin-left: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: color 0.15s;
}
.eye-toggle:hover {
  color: #334155;
}

/* ── Inline Captcha from Screenshot ── */
.captcha-container {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 4px;
  margin-bottom: 24px;
  padding: 10px 14px;
  background: #f4f8f6;
  border-radius: 14px;
  border: 1px solid #d5e4dd;
  user-select: none;
  flex-wrap: wrap;
}
.captcha-question {
  font-size: 14px;
  font-weight: 700;
  color: #1e293b;
  letter-spacing: -0.2px;
}
.captcha-box-wrap {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.captcha-input {
  width: 105px;
  height: 38px;
  background: #ffffff;
  border: 1.5px solid #cbd5e1;
  border-radius: 10px;
  padding: 6px 12px;
  font-family: inherit;
  font-size: 14px;
  font-weight: 700;
  color: #1e293b;
  text-align: center;
  outline: none;
  transition: all 0.2s ease;
}
.captcha-input:focus {
  border-color: #00a86b;
  box-shadow: 0 0 0 3px rgba(0, 168, 107, 0.2);
}
.captcha-input::placeholder {
  color: #94a3b8;
  font-weight: 400;
  font-style: italic;
}
.captcha-reload {
  background: transparent;
  border: none;
  color: #64748b;
  font-size: 14px;
  cursor: pointer;
  padding: 4px 6px;
  border-radius: 4px;
  transition: all 0.2s ease;
}
.captcha-reload:hover {
  color: #111827;
  transform: rotate(45deg);
}

/* ── Vibrant Green LOGIN Pill Button from Screenshot ── */
.login-btn-green {
  width: 100%;
  height: 52px;
  border-radius: 9999px;
  border: none;
  background: linear-gradient(135deg, #00a86b 0%, #059669 100%);
  color: #ffffff;
  font-family: inherit;
  font-size: 15px;
  font-weight: 800;
  letter-spacing: 0.6px;
  text-transform: uppercase;
  cursor: pointer;
  box-shadow: 0 6px 18px rgba(0, 168, 107, 0.35);
  transition: all 0.2s ease;
}
.login-btn-green:hover {
  background: linear-gradient(135deg, #00965f 0%, #047857 100%);
  transform: translateY(-1px);
  box-shadow: 0 8px 22px rgba(0, 168, 107, 0.45);
}
.login-btn-green:active {
  transform: translateY(0);
}
.login-btn-green:disabled {
  opacity: 0.7;
  cursor: not-allowed;
  transform: none;
}

.login-modal {
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.65);
  backdrop-filter: blur(4px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  padding: 16px;
}
.login-modal-content {
  background: #ffffff;
  border-radius: 16px;
  max-width: 400px;
  width: 100%;
  padding: 24px;
  box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
  animation: modalFadeIn 0.2s ease-out;
}
@keyframes modalFadeIn {
  from { opacity: 0; transform: scale(0.96); }
  to { opacity: 1; transform: scale(1); }
}

@media (max-width: 440px) {
  .login-card {
    padding: 34px 22px 30px;
    border-radius: 22px;
  }
}
</style>
</head>
<body>

<main class="login-card">
  <!-- Brand Logo -->
  <div class="brand-logo-wrap">
    <img id="login-logo-img" class="brand-logo-img" src="/static/img/humax-sms-logo.png" style="max-height:100%;max-width:100%;width:auto;height:auto;object-fit:contain;display:block;" onerror="this.onerror=null;this.src='/static/img/custom-logo.png';" alt="HUMAX SMS">
  </div>

  <!-- Subtitle matching user screenshot -->
  <div class="login-sub">Please sign in to continue.</div>

  <!-- Error Notification -->
  <div id="errorMsg" class="login-err" style="display:none;"></div>

  <!-- Login Form -->
  <form id="loginForm" novalidate>
    <!-- Username -->
    <div class="pill-input-wrap">
      <i class="fas fa-envelope pill-icon"></i>
      <input type="text" id="username" name="username" placeholder="Username" autocomplete="username" required>
    </div>

    <!-- Password -->
    <div class="pill-input-wrap">
      <i class="fas fa-lock pill-icon"></i>
      <input type="password" id="password" name="password" placeholder="Password" autocomplete="current-password" required>
      <button type="button" class="eye-toggle" id="togglePassword" aria-label="Toggle password visibility">
        <i class="far fa-eye" id="eyeIcon"></i>
      </button>
    </div>

    <!-- 2FA Code Input (Revealed if account has 2FA enabled) -->
    <div id="twoFaWrap" style="display:none; margin-bottom: 16px;">
      <div class="pill-input-wrap" style="border-color: #0284c7; box-shadow: 0 0 0 2px rgba(2, 132, 199, 0.15);">
        <i class="fas fa-shield-alt pill-icon" style="color: #0284c7;"></i>
        <input type="text" id="twoFaCode" name="two_fa_code" placeholder="2FA code" autocomplete="one-time-code" maxlength="8">
      </div>
      <div id="twoFaHint" style="font-size: 12px; color: #ef4444; font-weight: 600; margin-top: 4px; padding-left: 12px;">Enter your 2FA code.</div>
    </div>

    <!-- Inline Math Captcha -->
    <div class="captcha-container">
      <span class="captcha-question" id="captchaQuestion">What is 12 + 5 =</span>
      <div class="captcha-box-wrap">
        <input type="number" id="captchaInput" class="captcha-input" placeholder="Answer" autocomplete="off" required>
        <button type="button" class="captcha-reload" id="reloadCaptcha" title="Change Question" aria-label="Refresh Captcha">
          <i class="fas fa-sync-alt"></i>
        </button>
      </div>
    </div>

    <!-- Green LOGIN Button -->
    <button type="submit" class="login-btn-green" id="submitBtn">LOGIN</button>

  </form>
</main>

<script>
// Synchronous instant brand load (zero lag / zero flash)
function applyBrandUI(s) {
  if (!s) return;
  const name = s.site_name || 'HUMAX SMS';
  document.title = name + ' | Login';
  if (s.logo_url) {
    const logoEl = document.getElementById('login-logo-img');
    if (logoEl) {
      logoEl.src = s.logo_url;
      logoEl.alt = name;
    }
  }
}

// 1. Apply immediately from window.__BRAND_SETTINGS__ or localStorage (0ms delay)
try {
  const instant = window.__BRAND_SETTINGS__ || JSON.parse(localStorage.getItem('app_brand_settings') || '{}');
  if (instant && Object.keys(instant).length) applyBrandUI(instant);
} catch (e) {}

// 2. Refresh silently in background if needed
(async function loadSettings() {
  try {
    const res = await fetch('/api/settings');
    if (res.ok) {
      const s = await res.json();
      if (s) applyBrandUI(s);
    }
  } catch (_) {}
})();

// Math Captcha Logic with Server Challenge
let currentCaptchaId = '';
let currentCaptchaAnswer = null;

async function generateCaptcha() {
  const qEl = document.getElementById('captchaQuestion');
  const inp = document.getElementById('captchaInput');
  if (inp) {
    inp.value = '';
    inp.placeholder = 'Answer';
  }
  try {
    const res = await fetch('/api/auth/captcha');
    if (res.ok) {
      const data = await res.json();
      currentCaptchaId = data.id;
      if (qEl) qEl.textContent = data.question;
      // Extract expected answer from question string e.g. "What is 7 + 5 ="
      const match = data.question.match(/(\d+)\s*\+\s*(\d+)/);
      if (match) {
        currentCaptchaAnswer = parseInt(match[1], 10) + parseInt(match[2], 10);
      }
      return;
    }
  } catch (_) {}

  // Local fallback challenge if offline
  const n1 = Math.floor(Math.random() * 12) + 1;
  const n2 = Math.floor(Math.random() * 12) + 1;
  currentCaptchaAnswer = n1 + n2;
  currentCaptchaId = 'local_' + Date.now();
  if (qEl) qEl.textContent = 'What is ' + n1 + ' + ' + n2 + ' =';
}
const reloadBtn = document.getElementById('reloadCaptcha');
if (reloadBtn) reloadBtn.addEventListener('click', generateCaptcha);
generateCaptcha();

const loginForm = document.getElementById('loginForm');
const username = document.getElementById('username');
const password = document.getElementById('password');
const errorMsg = document.getElementById('errorMsg');
const submitBtn = document.getElementById('submitBtn');
const togglePassword = document.getElementById('togglePassword');
const eyeIcon = document.getElementById('eyeIcon');

togglePassword.addEventListener('click', () => {
  const hidden = password.type === 'password';
  password.type = hidden ? 'text' : 'password';
  if (eyeIcon) {
    eyeIcon.className = hidden ? 'far fa-eye-slash' : 'far fa-eye';
  }
});

function showError(msg) {
  errorMsg.textContent = msg;
  errorMsg.style.display = 'block';
}
function hideError() {
  errorMsg.textContent = '';
  errorMsg.style.display = 'none';
}

loginForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  hideError();

  const u = username.value.trim();
  const p = password.value.trim();

  if (!u) {
    showError('Please enter your username');
    username.focus();
    return;
  }
  if (!p) {
    showError('Please enter your password');
    password.focus();
    return;
  }

  // Strict math captcha validation
  const captchaInp = document.getElementById('captchaInput');
  const userAnsRaw = (captchaInp ? captchaInp.value : '').trim();
  if (!userAnsRaw) {
    showError('Please enter the answer to the math captcha.');
    if (captchaInp) captchaInp.focus();
    return;
  }
  const userAns = parseInt(userAnsRaw, 10);
  if (isNaN(userAns) || (currentCaptchaAnswer !== null && userAns !== currentCaptchaAnswer)) {
    showError('Incorrect captcha answer. Please calculate the sum and try again.');
    if (captchaInp) {
      captchaInp.value = '';
      captchaInp.focus();
    }
    generateCaptcha();
    return;
  }

  const twoFaInp = document.getElementById('twoFaCode');
  const twoFaCode = (twoFaInp ? twoFaInp.value : '').trim();

  submitBtn.disabled = true;
  submitBtn.textContent = 'LOGGING IN...';

  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: u,
        password: p,
        two_fa_code: twoFaCode,
        captcha_id: currentCaptchaId,
        captcha_answer: userAns
      })
    });

    const data = await res.json();

    // ── If account requires 2FA code ──
    if (data.require_2fa) {
      const wrap = document.getElementById('twoFaWrap');
      if (wrap) wrap.style.display = 'block';
      if (data.error) {
        showError(data.error);
      } else {
        hideError();
      }
      if (twoFaInp) {
        twoFaInp.focus();
      }
      submitBtn.disabled = false;
      submitBtn.textContent = 'LOGIN';
      return;
    }

    if (!res.ok || !data.success) {
      showError(data.error || data.detail || 'Invalid username or password');
      submitBtn.disabled = false;
      submitBtn.textContent = 'LOGIN';
      return;
    }

    const userObj = data.user || {
      id: data.id || 1,
      username: data.username || u,
      role: data.role || 'Owner'
    };
    const token = data.token || '';
    const role = (userObj.role || data.role || 'Owner').trim();
    userObj.role = role;
    if (token) userObj.token = token;



    if (window.SpeedAuth) {
      window.SpeedAuth.setSession(userObj, token);
    } else {
      sessionStorage.setItem('admin_logged_in', '1');
      sessionStorage.setItem('admin_user', JSON.stringify(userObj));
      sessionStorage.setItem('session_role', role);
      if (token) sessionStorage.setItem('session_token', token);

      localStorage.setItem('admin_logged_in', '1');
      localStorage.setItem('admin_user', JSON.stringify(userObj));
      localStorage.setItem('active_session_active', '1');
      localStorage.setItem('active_session_role', role);
      localStorage.setItem('active_session_user', JSON.stringify(userObj));
      if (token) localStorage.setItem('session_token', token);
    }

    const nr = (role || '').toLowerCase();
    let targetUrl = '/ints/owner/SMSDashboard';
    if (nr === 'manager') {
      targetUrl = '/ints/manager/SMSDashboard';
    } else if (nr === 'agent') {
      targetUrl = '/ints/agent/SMSDashboard';
    } else if (nr === 'client' || nr === 'reseller') {
      targetUrl = '/ints/client/SMSDashboard';
    } else if (nr === 'testpanel') {
      targetUrl = '/ints/testpanel/SMSDashboard';
    } else {
      targetUrl = '/ints/owner/SMSDashboard';
    }

    const delim = targetUrl.includes('?') ? '&' : '?';
    const finalUrl = token ? `${targetUrl}${delim}token=${encodeURIComponent(token)}` : targetUrl;
    window.location.replace(finalUrl);
  } catch (err) {
    showError('Network error. Please try again.');
    submitBtn.disabled = false;
    submitBtn.textContent = 'LOGIN';
  }
});
</script>

</body>
</html>
